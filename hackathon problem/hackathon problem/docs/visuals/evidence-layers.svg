<svg xmlns="http://www.w3.org/2000/svg" width="960" height="428" viewBox="0 0 960 428" role="img" aria-labelledby="title desc">
<title id="title">Three evidence views in one report</title><desc id="desc">In the sustained improvement example, checkpoint 2 stage counts are A9 B6; cumulative counts are A21 B9. The final independent group has A10 B10 and is used to choose the winner.</desc>
<rect width="960" height="428" rx="18" fill="#f5f7fc"/><g font-family="Arial, sans-serif"><text x="32" y="36" fill="#7d72b7" font-size="12" font-weight="700" letter-spacing="2">THE REPORT / EVIDENCE YOU CAN INSPECT</text><text x="32" y="73" fill="#2c3e5d" font-size="26" font-weight="700">Different scopes. Clear denominators.</text><text x="32" y="100" fill="#7b8ba4" font-size="14">Example: Sustained improvement, with all three buyer goals selected.</text>
<g fill="#fff" stroke="#e0e5f0"><rect x="32" y="128" width="282" height="241" rx="12"/><rect x="339" y="128" width="282" height="241" rx="12"/><rect x="646" y="128" width="282" height="241" rx="12"/></g>
<g font-size="11" font-weight="700" letter-spacing="1.2" fill="#9485bb"><text x="50" y="155">CHECKPOINT 2 / THIS STAGE</text><text x="357" y="155">CHECKPOINT 2 / CALLS SO FAR</text></g><text x="664" y="155" font-size="11" font-weight="700" letter-spacing="1.2" fill="#419077">FINAL / INDEPENDENT GROUP</text>
<g font-size="18" font-weight="700" fill="#445b7b"><text x="50" y="185">What changed recently?</text><text x="357" y="185">What is the overall trend?</text><text x="664" y="185">Has B earned a rollout?</text></g>
<g fill="#f2f5fc"><rect x="50" y="202" width="112" height="58" rx="8"/><rect x="357" y="202" width="112" height="58" rx="8"/><rect x="664" y="202" width="112" height="58" rx="8"/></g><g fill="#f1edfb"><rect x="174" y="202" width="122" height="58" rx="8"/><rect x="481" y="202" width="122" height="58" rx="8"/><rect x="788" y="202" width="122" height="58" rx="8"/></g>
<g fill="#7790b5" font-size="12"><text x="62" y="223">A calls</text><text x="369" y="223">A calls</text><text x="676" y="223">A calls</text></g><g fill="#9983bc" font-size="12"><text x="186" y="223">B calls</text><text x="493" y="223">B calls</text><text x="800" y="223">B calls</text></g>
