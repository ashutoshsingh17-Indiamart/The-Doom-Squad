<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
<title id="title">The VoiceOps experiment journey</title><desc id="desc">Design a challenger, choose goals and exposure, evaluate buyer calls, then expand, hold, reduce or stop traffic based on evidence.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f2f4ff"/><stop offset="1" stop-color="#edf8f5"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 10 5 0 10" fill="none" stroke="#9ea9cc" stroke-width="2"/></marker></defs>
<rect width="960" height="360" rx="20" fill="url(#bg)"/>
<g font-family="Arial, sans-serif"><text x="34" y="42" fill="#5b67bf" font-size="12" font-weight="700" letter-spacing="2">VOICEOPS / THE EXPERIMENT JOURNEY</text><text x="34" y="82" fill="#253453" font-size="29" font-weight="700">One prompt change. A clear path to rollout.</text><text x="34" y="109" fill="#7583a1" font-size="15">Set the goals. Control exposure. Inspect the evidence.</text>
<g fill="#fff" stroke="#dde4f2"><rect x="34" y="142" width="204" height="138" rx="12"/><rect x="263" y="142" width="204" height="138" rx="12"/><rect x="492" y="142" width="204" height="138" rx="12"/><rect x="721" y="142" width="205" height="138" rx="12"/></g>
<g fill="#eeefff"><rect x="50" y="158" width="30" height="30" rx="8"/><rect x="279" y="158" width="30" height="30" rx="8"/><rect x="508" y="158" width="30" height="30" rx="8"/></g><rect x="737" y="158" width="30" height="30" rx="8" fill="#e8f6f0"/>
<g font-size="13" font-weight="700" fill="#655dc2"><text x="57" y="178">01</text><text x="286" y="178">02</text><text x="515" y="178">03</text></g><text x="744" y="178" fill="#258b6b" font-size="13" font-weight="700">04</text>
<g font-size="17" font-weight="700" fill="#344567"><text x="50" y="218">Design the challenger</text><text x="279" y="218">Set the controls</text><text x="508" y="218">Evaluate each call</text><text x="737" y="218">Decide &amp; explain</text></g>
<g font-size="13" fill="#7a88a2"><text x="50" y="244">Review A / B instructions.</text><text x="50" y="263">Freeze the change.</text><text x="279" y="244">Choose buyer goals,</text><text x="279" y="263">traffic and safety rules.</text><text x="508" y="244">Score the selected goals.</text><text x="508" y="263">Keep transcript evidence.</text><text x="737" y="244">Grow, hold, reduce or stop.</text><text x="737" y="263">Keep every checkpoint.</text></g>
<g stroke="#9ea9cc" stroke-width="1.5" marker-end="url(#arrow)"><path d="M242 211h16"/><path d="M471 211h16"/><path d="M700 211h16"/></g>
<text x="34" y="323" fill="#7383a0" font-size="13">Every result retains its prompt versions, call evidence, traffic decisions and PDF report.</text></g></svg>
