<title id="title">VoiceOps platform architecture</title><desc id="desc">The React workspace uses backend APIs for Sarvam-105B conversation services, Sarvam Bulbul and Saaras voice, and Supabase persistence. Transcript evaluation feeds goal scoring and rollout policy, with a traceable report and PDF.</desc>
